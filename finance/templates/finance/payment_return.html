<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Payment Result</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f3f4f6; margin: 0; padding: 24px; }
    .card { max-width: 560px; margin: 40px auto; background: #fff; border-radius: 12px; padding: 24px; box-shadow: 0 8px 30px rgba(0,0,0,.08); }
    .ok { color: #0f766e; }
    .fail { color: #b91c1c; }
    .meta { margin-top: 12px; color: #374151; }
    code { background: #f3f4f6; padding: 2px 6px; border-radius: 6px; }
  </style>
</head>
<body>
  <div class="card">
    <h1 class="{% if page_status == 'paid' %}ok{% else %}fail{% endif %}">
      {% if page_status == 'paid' %}Payment Successful{% else %}Payment Failed{% endif %}
    </h1>
    <p class="meta">Transaction ID: <code>{{ transaction.id }}</code></p>
    <p class="meta">Gateway Ref: <code>{{ transaction.gateway_reference }}</code></p>
    <p class="meta">Amount: <code>{{ transaction.amount }}</code></p>
    <p class="meta">Type: <code>{{ transaction.transaction_type }}</code></p>
  </div>
</body>
</html>
